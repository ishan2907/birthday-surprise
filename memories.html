<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Little Conversations ♥</title>
    <link rel="stylesheet" href="memories.css">
    <script src="memories.js" defer></script>
</head>
<body>
    <div class="sky-glow glow-one"></div>
    <div class="sky-glow glow-two"></div>

    <a class="back-link" href="index.html">← Back to home</a>

    <main class="page-shell">
        <header class="page-heading">
            <p class="eyebrow">A LITTLE PIECE OF US</p>
            <h1>Our Little <span>Conversations</span></h1>
            <p class="subtitle">Little words, big feelings, and my favourite person. ♡</p>
        </header>

        <section class="memory-layout" aria-label="A collection of our conversations">
            <div class="message-column left-column" id="leftMessages"></div>

            <div class="couple-area">
                <div class="photo-frame">
                    <span class="photo-sparkle sparkle-one">✧</span>
                    <span class="photo-sparkle sparkle-two">♡</span>
                    <img src="couple-kiss.png"
                         alt="An illustrated boy in a white shirt kissing a girl in a dark pink kurti on her head">
                </div>
                <p class="photo-caption">A little moment I'd choose a thousand times. ♡</p>
                <div class="center-note">
                    <span>YOU + ME</span>
                    <strong>My favourite kind of forever.</strong>
                </div>
            </div>

            <div class="message-column right-column" id="rightMessages"></div>
        </section>

        <footer class="closing-note">
            <span class="tiny-heart">♥</span>
            <p>Some conversations become memories.</p>
            <p class="closing-script">And you're my favourite one.</p>
            <span class="tiny-heart">♥</span>
        </footer>
    </main>
</body>
</html>
